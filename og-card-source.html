<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=block">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#6b4cf6}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;
       font-family:"Baloo 2",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  ol{list-style:none;display:flex;gap:22px;padding:0;margin:0}
  li{width:140px;height:140px;border-radius:30px;display:grid;place-items:center;
     font-weight:800;font-size:92px;line-height:1;padding-top:12px}
  .r{background:#22c55e;box-shadow:0 10px 0 #15803d}
  .w{background:#ff4f6d;box-shadow:0 10px 0 #be123c}
  p{margin:0;font-weight:700;font-size:34px;line-height:1.2;color:#fff}
</style></head><body>
<ol><li class="r">F</li><li class="r">A</li><li class="w">K</li><li class="r">L</li><li class="r">E</li></ol>
<p>Four headlines from the last 24 hours. One is made up.</p>
</body></html>
