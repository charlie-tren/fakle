name: daily-puzzle
# One Story commits its history at about 05:00 Sydney. Each rung below is a no-op
# once today's puzzle exists, and waits quietly if One Story has not landed yet.
on:
  schedule:
    - cron: "10 17 * * *"
    - cron: "10 18 * * *"
    - cron: "10 19 * * *"
    - cron: "10 20 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [heartbeat]
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python build.py
      - name: Commit
        run: |
          git config user.name "fakle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add puzzle.json
          git diff --cached --quiet && exit 0
          git commit -m "Puzzle: $(python -c 'import json;print(json.load(open("puzzle.json"))["date"])')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
