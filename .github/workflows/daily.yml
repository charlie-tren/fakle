name: daily-puzzle
# One Story commits its history at about 05:00 Sydney. Each rung below rebuilds only a
# mode that is missing for today, and waits quietly if One Story has not landed yet.
#
# Pages is deployed from this workflow, never from a commit: puzzle.json is not in git,
# so yesterday's fakes are not left readable in the repo's public history. The current
# file is fetched from the live site first, which is what the "already built" check reads.
#
# One job, so the page deploys even when the build fails (it then says there is no Fakle
# today), and the last step turns the run red so the failure is still seen.
on:
  schedule:
    - cron: "10 17 * * *"
    - cron: "10 18 * * *"
    - cron: "10 19 * * *"
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's puzzle from scratch"
        type: boolean
        default: false
  repository_dispatch:
    types: [heartbeat]
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Fetch the live puzzle
        run: curl -sf https://charlietrenorden.com/fakle/puzzle.json -o puzzle.json || rm -f puzzle.json
      - name: Build
        id: build
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python build.py ${{ inputs.force && '--force' || '' }}
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html app.js style.css og-card.png _site/
          for f in puzzle.json favicon.svg favicon.ico favicon-48.png favicon-192.png apple-touch-icon.png; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          ls -la _site
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Fail the run if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
