# Builds puzzles for past dates with the real models and prints them. Nothing is
# deployed or committed. Spends ~15 free-tier calls a date from the SAME quota as the
# daily build; three trials emptied it on 14/10. It resets at midnight Pacific
# (17:00-18:00 Sydney), before the 05:00 build.
name: trial
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Space-separated YYYY-MM-DD"
        required: true
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATES: ${{ inputs.dates }}
        run: python tools/trial.py $DATES
